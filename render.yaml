services:
  - type: web
    name: actual-faceit-bot
    env: python
    region: frankfurt
    plan: free
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: >
      apt-get update -y &&
      apt-get install -y
        libcairo2
        libpango-1.0-0
        libpangocairo-1.0-0
        libgdk-pixbuf2.0-0
        libffi-dev
        shared-mime-info
        fonts-dejavu-core &&
      pip install -r requirements_aiogram.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: LOG_CHAT_ID
        sync: false
      - key: LOG_THREAD_ID
        value: "0"
      - key: RESULTS_THREAD_ID
        value: "0"
      - key: PORT
        value: "8099"
