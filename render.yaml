services:
  - type: web
    name: telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: LOG_CHAT_ID
        sync: false
      - key: LOG_THREAD_ID
        sync: false
      - key: RESULTS_THREAD_ID
        sync: false
      - key: PORT
        value: 10000
